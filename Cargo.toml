[workspace]
resolver = "2"
members = [
    "services/ingestor",
    "services/decoder",
    "services/alerter",
    "services/replay",
    "crates/solana-rpc-client",
    "crates/schema-registry",
    "crates/solobserve-types",
    "crates/solobserve-storage",
    "crates/solobserve-config",
    "crates/idl-parser",
    "crates/solobserve-dsl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
tokio = { version = "1.41", features = ["full"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
async-nats = "0.38"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "uuid", "migrate"] }
clickhouse = { version = "0.13", features = ["rustls-tls"] }
aws-sdk-s3 = { version = "1.65", default-features = false, features = ["rustls", "rt-tokio"] }
aws-config = { version = "1.5", default-features = false, features = ["rustls", "rt-tokio"] }
aws-credential-types = "1.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-stream = "0.1"
futures = "0.3"
rand = "0.8"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
zstd = "0.13"
prometheus = { version = "0.13", default-features = false }
once_cell = "1"
base64 = "0.22"
sha2 = "0.10"
regex = "1"
axum = "0.7"

solobserve-types = { path = "crates/solobserve-types" }
solobserve-storage = { path = "crates/solobserve-storage" }
solobserve-config = { path = "crates/solobserve-config" }
solana-rpc-client = { path = "crates/solana-rpc-client" }
schema-registry = { path = "crates/schema-registry" }
idl-parser = { path = "crates/idl-parser" }
solobserve-dsl = { path = "crates/solobserve-dsl" }

[profile.release]
lto = "thin"
codegen-units = 1
