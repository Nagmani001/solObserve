name: solobserve

# localnet note (plan 3): run `solana-test-validator` on host and point
# SOLANA_LOCALNET_RPC=http://host.docker.internal:8899 and WS=ws://host.docker.internal:8900.
services:
  postgres:
    image: postgres:16-alpine
    container_name: solobserve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: solobserve
      POSTGRES_PASSWORD: solobserve
      POSTGRES_DB: solobserve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solobserve -d solobserve"]
      interval: 2s
      timeout: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: solobserve-clickhouse
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  nats:
    image: nats:2.10-alpine
    container_name: solobserve-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    container_name: solobserve-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:latest
    container_name: solobserve-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/solobserve-raw &&
        echo 'bucket ready'
      "
    restart: "no"

  metrics-scraper:
    image: rust:1.86
    container_name: solobserve-metrics-scraper
    working_dir: /workspace
    command: >
      /bin/bash -lc "cargo run --manifest-path services/metrics-scraper/Cargo.toml"
    environment:
      POSTGRES_URL: postgresql://solobserve:solobserve@postgres:5432/solobserve
      DATABASE_URL: postgresql://solobserve:solobserve@postgres:5432/solobserve
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DB: solobserve
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: solobserve-raw
      S3_FORCE_PATH_STYLE: "true"
      INGESTOR_METRICS_URL: http://ingestor:9100/metrics
      DECODER_METRICS_URL: http://decoder:9191/metrics
    volumes:
      - ..:/workspace
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/workspace/target
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  error-grouper:
    image: rust:1.86
    container_name: solobserve-error-grouper
    working_dir: /workspace
    command: >
      /bin/bash -lc "cargo run --manifest-path services/error-grouper/Cargo.toml"
    environment:
      POSTGRES_URL: postgresql://solobserve:solobserve@postgres:5432/solobserve
      DATABASE_URL: postgresql://solobserve:solobserve@postgres:5432/solobserve
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DB: solobserve
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: solobserve-raw
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - ..:/workspace
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/workspace/target
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  alerter:
    image: rust:1.86
    container_name: solobserve-alerter
    working_dir: /workspace
    command: >
      /bin/bash -lc "cargo run --manifest-path services/alerter/Cargo.toml"
    environment:
      POSTGRES_URL: postgresql://solobserve:solobserve@postgres:5432/solobserve
      DATABASE_URL: postgresql://solobserve:solobserve@postgres:5432/solobserve
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DB: solobserve
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: solobserve-raw
      S3_FORCE_PATH_STYLE: "true"
      ALERT_ENCRYPTION_KEY: "replace_with_32_byte_key"
    volumes:
      - ..:/workspace
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/workspace/target
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  chdata:
  natsdata:
  miniodata:
  cargo-cache:
  target-cache:
